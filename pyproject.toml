[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echodesk"
version = "3.2.0"
description = "Modular AI desktop assistant"
requires-python = ">=3.11"
dependencies = ["PySide6", "requests", "pillow", "mss", "easyocr", "numpy", "psutil", "SpeechRecognition", "pyttsx3"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
echodesk-studio = "ui.studio:run_studio"
